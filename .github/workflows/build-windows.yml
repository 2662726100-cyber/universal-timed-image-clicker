name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "通用定时图像点击器" --distpath dist --workpath build --specpath . --collect-all cv2 src/universal_clicker.py
          Move-Item dist/通用定时图像点击器.exe dist/Universal-Timed-Image-Clicker-Windows-x64.exe
          Copy-Item docs/通用版使用说明.md dist/User-Guide.zh-CN.md
          Get-FileHash -Algorithm SHA256 dist/Universal-Timed-Image-Clicker-Windows-x64.exe | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: 通用定时图像点击器-Windows
          path: |
            dist/Universal-Timed-Image-Clicker-Windows-x64.exe
            dist/User-Guide.zh-CN.md
          if-no-files-found: error

      - name: Create GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "dist/Universal-Timed-Image-Clicker-Windows-x64.exe" "dist/User-Guide.zh-CN.md" --generate-notes --title "通用定时图像点击器 ${{ github.ref_name }}"
